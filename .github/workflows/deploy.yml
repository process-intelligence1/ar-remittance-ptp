# Build the API image, push it to GitHub Container Registry, and roll it out to Azure Container Apps.
# Azure sign-in uses OIDC (federated credential) - there are no client secrets anywhere.
# Infrastructure (infra/*.bicep) is deployed from the laptop; see docs/DAY3_GUIDE.md.
name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/process-intelligence1/ar-api
  RESOURCE_GROUP: rg-ar-demo
  APP_NAME: ar-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure (demo)
    needs: build
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the Container App at the new image
        id: update
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --output none 2>/dev/null; then
            echo "::notice::Container App $APP_NAME does not exist yet - run infra/deploy.ps1 first. Image was pushed; skipping rollout."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" --output none

      - name: Smoke test /api/health (first call may take ~20 s while it scales from zero)
        if: steps.update.outputs.skipped != 'true'
        run: |
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API URL: https://$fqdn"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "https://$fqdn/api/health"; then echo; exit 0; fi
            echo "not ready yet (attempt $i), retrying in 10 s"; sleep 10
          done
          exit 1
