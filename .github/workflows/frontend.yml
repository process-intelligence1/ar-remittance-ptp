name: Publish site (GitHub Pages)

# Builds the front-end and publishes the site: root = the DEMO edition (snapshot data, no server; M15), /live/ = the live edition
# working against the Azure API, plus /privacy.html and /terms.html. The demo edition needs snapshot/ (made on the laptop by
# scripts.export_snapshot + scripts.check_snapshot, committed); the sample files and the PDF page images are put into the site here.
# The API address is NOT in the repo: it comes from the repository variable API_BASE_URL (Settings -> Variables).
# Set the repository variable LIVE_ENDED to "true" after the Azure environment is gone: /live/ then says so.
on:
  push:
    branches: [main]
    paths: ["frontend/**", "pages/**", "snapshot/**", "data/samples/**", ".github/workflows/frontend.yml", ".github/scripts/build_site_files.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test, build the live edition
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/live/
          VITE_DATA_SOURCE: live
          VITE_API_URL: ${{ vars.API_BASE_URL }}
          VITE_LIVE_ENDED: ${{ vars.LIVE_ENDED }}
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the demo edition (snapshot data, at the site root)
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DATA_SOURCE: snapshot
        run: npm run build -- --outDir dist-demo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble the site (demo edition at the root, live edition under /live/)
        run: |
          mkdir -p site/live
          cp -r pages/. site/                      # landing page (replaced below), privacy.html, terms.html
          cp -r frontend/dist-demo/. site/         # demo edition: index.html + assets
          cp -r frontend/dist/. site/live/         # live edition
          pip install --quiet pymupdf==1.28.2
          python .github/scripts/build_site_files.py site --max-mb 250
          du -sm site | awk '{print "Site size: " $1 " MB (limit 300 MB)"}'
          test "$(du -sm site | cut -f1)" -le 300
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
