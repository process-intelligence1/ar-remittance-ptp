# Build the API image, push it to GitHub Container Registry, and roll it out to Azure Container Apps.
# Azure sign-in uses OIDC (federated credential) - there are no client secrets anywhere.
# Infrastructure (infra/*.bicep) is deployed from the laptop; see docs/DAY3_GUIDE.md.
name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/process-intelligence1/ar-api
  RESOURCE_GROUP: rg-ar-demo
  APP_NAME: ar-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # no attestation side-manifests: one registry version per push
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure (demo)
    needs: build
    runs-on: ubuntu-latest
    environment: demo  # required reviewer: every deploy waits for the owner's approval
    permissions:
      contents: read
      id-token: write
    outputs:
      running: ${{ steps.running.outputs.images }}
    steps:
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the Container App at the new image
        id: update
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --output none 2>/dev/null; then
            echo "::notice::Container App $APP_NAME does not exist yet - run infra/deploy.ps1 first. Image was pushed; skipping rollout."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" --output none

      - name: Smoke test /api/health (first call may take ~20 s while it scales from zero)
        if: steps.update.outputs.skipped != 'true'
        run: |
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API URL: https://$fqdn"
          for i in $(seq 1 18); do
            if curl -fsS --max-time 30 "https://$fqdn/api/health"; then echo; exit 0; fi
            echo "not ready yet (attempt $i), retrying in 10 s"; sleep 10
          done
          exit 1

      - name: Images the Container App is running (never deleted by the clean-up)
        id: running
        if: always()
        run: |
          images=$(az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP"                    --query "[?properties.active].properties.template.containers[].image" -o tsv 2>/dev/null | sort -u | tr '
' ' ')
          echo "Running: ${images:-unknown}"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Clean up GHCR (keep 3 newest + running) and report storage
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete all but the 3 newest image versions (and never the running ones)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNING: ${{ needs.deploy.outputs.running }}
        run: bash .github/scripts/ghcr_cleanup.sh 3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report image size and GitHub Packages storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          # compressed sizes as stored in the registry. A version is either an image manifest
          # (config + layers) or an image index (older builds with attestations) -> add its children.
          # A child of an old index may already be deleted (it was its own "version"): count it as 0.
          image_size() {
            local raw
            if ! raw=$(docker buildx imagetools inspect --raw "$IMAGE@$1" 2>/dev/null); then
              echo "missing ${1:7:12}" >> missing.txt; echo 0; return
            fi
            if echo "$raw" | jq -e '.manifests' > /dev/null; then
              local s=0 c n
              for c in $(echo "$raw" | jq -r '.manifests[].digest'); do n=$(image_size "$c"); s=$((s + n)); done
              echo "$s"
            else
              echo "$raw" | jq -r '.layers[]? | "\(.digest) \(.size)"' >> layers.txt
              echo "$raw" | jq '[.config.size // 0] + [.layers[]?.size] | add'
            fi
          }
          digests=$(gh api "/users/$owner/packages/container/ar-api/versions" --paginate --jq '.[].name')
          : > layers.txt; : > missing.txt; total=0; summary=""
          for d in $digests; do
            size=$(image_size "$d")
            tags=$(gh api "/users/$owner/packages/container/ar-api/versions" --paginate \
                   --jq ".[] | select(.name==\"$d\") | .metadata.container.tags | join(\",\")")
            total=$((total + size))
            summary="$summary| ${tags:-untagged} | ${d:7:12} | $((size / 1048576)) MB |\n"
          done
          unique=$(sort -u layers.txt | awk '{s+=$2} END {print s+0}')
          current=$(image_size "$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)")
          {
            echo "### GHCR storage (public package: storage is free; 3 newest versions + running kept)"
            echo ""
            echo "This image (${GITHUB_SHA:0:7}): **$((current / 1048576)) MB** compressed"
            echo ""
            echo "| Tags | Digest | Size |"
            echo "|---|---|---|"
            printf "$summary"
            echo ""
            echo "Versions kept: $(echo "$digests" | wc -w). Storage used: **$((unique / 1048576)) MB** (shared layers counted once);"
            echo "upper bound if every version is counted in full: $((total / 1048576)) MB."
            if [ -s missing.txt ]; then
              echo ""
              echo "Parts of older image indexes already deleted (counted as 0): $(sort -u missing.txt | wc -l)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
