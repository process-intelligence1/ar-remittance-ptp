# Secret scan with gitleaks: full git history, the checked-out files, and every stored API image.
# Values are redacted - the log shows only the rule, file, commit and line.
# Runs on every push to main, every Monday, and on demand (Actions tab, "Run workflow"). The run FAILS (red) when any scan finds
# anything, so a green run means clean. Accepted findings are listed in .gitleaks.toml / .gitleaksignore with the reason (M13).
name: Secret scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  GITLEAKS: zricethezav/gitleaks:v8.24.0
  IMAGE: ghcr.io/process-intelligence1/ar-api

jobs:
  scan:
    name: gitleaks (history, files, images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history

      - name: Scan full git history (all branches)
        run: |
          git fetch --all --quiet || true
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --log-opts="--all" --config /repo/.gitleaks.toml --redact \
            --report-format json --report-path /repo/history.json --no-banner --exit-code 0
          bash .github/scripts/leaks_summary.sh history.json "git history (all branches, every commit)"

      - name: Scan the files as they are now
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" dir /repo --config /repo/.gitleaks.toml --redact \
            --report-format json --report-path /repo/files.json --no-banner --exit-code 0
          bash .github/scripts/leaks_summary.sh files.json "working tree (this commit)"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan every stored image version (our code, home folders, settings baked into the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/ar-api/versions" --paginate \
                 --jq '.[].metadata.container.tags[]' | grep -v '^latest$' || true)
          for t in $tags; do
            echo "== image $IMAGE:$t"
            docker pull -q "$IMAGE:$t" > /dev/null
            # environment variables baked into the image: names only
            echo "ENV names: $(docker inspect "$IMAGE:$t" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | tr '\n' ' ')"
            c=$(docker create "$IMAGE:$t"); rm -rf fs; mkdir fs
            docker export "$c" | tar -x -C fs --exclude='opt/*' --exclude='usr/*' --exclude='proc/*' --exclude='sys/*' 2>/dev/null || true
            docker rm "$c" > /dev/null
            docker run --rm -v "$PWD/fs:/fs" "$GITLEAKS" dir /fs --redact \
              --report-format json --report-path /fs/leaks.json --no-banner --exit-code 0
            bash .github/scripts/leaks_summary.sh fs/leaks.json "image ${t:0:7} (/srv code, /home, /root, /etc, /tmp)"
            jq 'length' fs/leaks.json >> /tmp/image_counts.txt 2>/dev/null || true
            docker rmi -f "$IMAGE:$t" > /dev/null
          done

      - name: Fail the run when any scan found something
        if: always()
        run: |
          total=0
          for f in history.json files.json; do n=$(jq 'length' "$f" 2>/dev/null || echo 0); total=$((total + n)); done
          images=$(awk '{s += $1} END {print s + 0}' /tmp/image_counts.txt 2>/dev/null || echo 0)
          total=$((total + images))
          echo "Findings in total (history + files + images): $total" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$total" -eq 0
