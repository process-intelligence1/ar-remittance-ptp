# Build the two images (slim API, full worker), push them to GitHub Container Registry, and roll them out to Azure.
# Azure sign-in uses OIDC (federated credential) - there are no client secrets anywhere.
# Order of the roll-out: database migrations (one-off job ar-migrate INSIDE Azure) -> API -> worker job.
# Images are always referenced by the commit SHA (never :latest).
# Infrastructure (infra/*.bicep) is deployed from the laptop; see docs/DAY3_GUIDE.md.
name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  IMAGE_API: ghcr.io/process-intelligence1/ar-api        # slim: API + migrations
  IMAGE_WORKER: ghcr.io/process-intelligence1/ar-worker  # full: OCR, used by the scheduled worker job
  RESOURCE_GROUP: rg-ar-demo
  APP_NAME: ar-api

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the slim API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          push: true
          tags: ${{ env.IMAGE_API }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # no attestation side-manifests: one registry version per push
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the full worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          push: true
          tags: ${{ env.IMAGE_WORKER }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Compressed size of both images
        run: |
          for pair in "api:$IMAGE_API" "worker:$IMAGE_WORKER"; do
            raw=$(docker buildx imagetools inspect --raw "${pair#*:}:${{ github.sha }}")
            size=$(echo "$raw" | jq '[.config.size // 0] + [.layers[]?.size] | add')
            echo "${pair%%:*} image: $((size / 1048576)) MB compressed" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    name: Deploy to Azure (demo)
    needs: build
    runs-on: ubuntu-latest
    environment: demo  # required reviewer: every deploy waits for the owner's approval
    permissions:
      contents: read
      id-token: write
    outputs:
      running: ${{ steps.running.outputs.images }}
    steps:
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check that the Azure resources exist
        id: check
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! az resource show -g "$RESOURCE_GROUP" -n "$APP_NAME" --resource-type Microsoft.App/containerApps --output none 2>/dev/null; then
            echo "::notice::Container App $APP_NAME does not exist yet - run infra/deploy.ps1 first. Images were pushed; skipping rollout."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the database migrations in Azure (one-off job ar-migrate, before the new API goes live)
        if: steps.check.outputs.skipped != 'true'
        run: |
          # The job runs INSIDE Azure with the app's identity: the database firewall is not opened to GitHub.
          if ! az resource show -g "$RESOURCE_GROUP" -n ar-migrate --resource-type Microsoft.App/jobs --output none 2>/dev/null; then
            echo "::error::Job ar-migrate does not exist - run infra/deploy.ps1 -ImageTag <sha> first (the API no longer migrates at start)."
            exit 1
          fi
          az containerapp job update --name ar-migrate --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_API:${{ github.sha }}" --output none
          exec_name=$(az containerapp job start --name ar-migrate --resource-group "$RESOURCE_GROUP" --query name -o tsv)
          echo "Started migration run $exec_name"
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show --name ar-migrate --resource-group "$RESOURCE_GROUP" \
                     --job-execution-name "$exec_name" --query properties.status -o tsv)
            echo "migration status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::The migration run ended as $status - the new API was NOT rolled out. See the job's logs in the Azure portal."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The migration run was still going after 10 minutes - nothing rolled out."; exit 1

      - name: Point the API at the new image
        if: steps.check.outputs.skipped != 'true'
        run: |
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_API:${{ github.sha }}" --output none

      - name: Point the worker job at the new full image
        if: steps.check.outputs.skipped != 'true'
        run: |
          if az resource show -g "$RESOURCE_GROUP" -n ar-worker --resource-type Microsoft.App/jobs --output none 2>/dev/null; then
            az containerapp job update --name ar-worker --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_WORKER:${{ github.sha }}" --output none
          else
            echo "::notice::Job ar-worker does not exist yet - run infra/deploy.ps1 first."
          fi

      - name: Smoke test /api/health (first call may take up to a minute while it scales from zero)
        if: steps.check.outputs.skipped != 'true'
        run: |
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API URL: https://$fqdn"
          for i in $(seq 1 18); do
            if curl -fsS --max-time 30 "https://$fqdn/api/health"; then echo; exit 0; fi
            echo "not ready yet (attempt $i), retrying in 10 s"; sleep 10
          done
          exit 1

      - name: Images Azure is running (never deleted by the clean-up)
        id: running
        if: always()
        run: |
          images=$(az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP" \
                   --query "[?properties.active].properties.template.containers[].image" -o tsv 2>/dev/null | sort -u | tr '\n' ' ')
          for job in ar-worker ar-migrate; do
            img=$(az containerapp job show -n "$job" -g "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
            images="$images $img"
          done
          echo "Running: ${images:-unknown}"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Clean up GHCR (keep 3 newest + running) and report storage
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout (the scripts)
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete all but the 3 newest image versions of each package (and never the running ones)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNING: ${{ needs.deploy.outputs.running }}
        run: |
          bash .github/scripts/ghcr_cleanup.sh ar-api 3
          bash .github/scripts/ghcr_cleanup.sh ar-worker 3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report image sizes and GitHub Packages storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/ghcr_report.sh ar-api
          bash .github/scripts/ghcr_report.sh ar-worker
          cat "$GITHUB_STEP_SUMMARY"
